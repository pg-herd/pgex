[package]
name = "pgex"
version = "0.1.5"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace]
members = ["crates/pg-dump-planner"]

[workspace.dependencies]
prost = "=0.14.6"
pq-sys = "=0.7.9"

[dependencies]
anyhow = "1.0.105"
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
pg_query = "=18.1.0"
time = { version = "0.3", features = ["macros", "parsing"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt", "net", "sync", "time"] }
unicode-width = { version = "0.2", default-features = false }

libc = "0.2"
pq-sys.workspace = true
postgres-types = { version = "0.2", features = ["with-time-0_3"] }

[dev-dependencies]
url = "2.5.9"
getrandom = "0.4.3"
tempfile = "3"
testcontainers = "0.28"
tokio = { version = "1", features = ["process"] }
