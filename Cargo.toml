[package]
name = "pgex"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
postgres-protocol = "0.6.12"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
sqlparser = { version = "=0.64.0", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["macros", "parsing"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt", "net", "sync", "time"] }
unicode-width = { version = "0.2", default-features = false }

whoami = "2"

libc = "0.2"
pq-sys = "=0.7.8"
postgres-types = { version = "0.2", features = ["with-time-0_3"] }

[dev-dependencies]
url = "2"
getrandom = "0.3"
mockall = "0.15"
tempfile = "3"
testcontainers = "0.28"
tokio = { version = "1", features = ["process"] }
