name: Linux packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-packages.yml'
      - 'release/apt/**'
      - 'release/rpm/**'
      - 'release/install.sh'
      - 'release/test-installer.sh'
  workflow_run:
    workflows: ['Release binaries']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (empty means latest stable release)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: linux-packages
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag=$(gh release view ${REQUESTED_TAG:+"$REQUESTED_TAG"} --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  package:
    needs: release
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            format: deb
            architecture: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            format: deb
            architecture: arm64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            format: rpm
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            format: rpm
            architecture: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the released binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="pgex-$TAG-$TARGET.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive*"
          sha256sum --check "$archive.sha256"
          mkdir input
          tar -xzf "$archive" --strip-components=1 -C input
      - name: Build native packages from the released executable
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
          FORMAT: ${{ matrix.format }}
        run: |
          mkdir packages previous
          case "$FORMAT" in
            deb)
              docker build --tag pgex-package-builder release/apt
              docker run --rm --mount type=bind,src="$PWD",dst=/work pgex-package-builder \
                /work/release/apt/build-package.sh /work/input "$VERSION" "$ARCHITECTURE" /work/packages
              docker run --rm --mount type=bind,src="$PWD",dst=/work pgex-package-builder \
                /work/release/apt/build-package.sh /work/input "$VERSION~test" "$ARCHITECTURE" /work/previous
              ;;
            rpm)
              docker build --tag pgex-package-builder release/rpm
              docker run --rm --mount type=bind,src="$PWD",dst=/work pgex-package-builder \
                /work/release/rpm/build-package.sh /work/input "$VERSION" "$ARCHITECTURE" /work/packages
              docker run --rm --mount type=bind,src="$PWD",dst=/work pgex-package-builder \
                /work/release/rpm/build-package.sh /work/input "$VERSION" "$ARCHITECTURE" /work/previous 0
              ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.format }}-${{ matrix.architecture }}
          path: |
            packages/*
            previous/*
          if-no-files-found: error

  test:
    needs: [release, package]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            format: deb
            architecture: amd64
            image: debian:bookworm-slim
          - runner: ubuntu-24.04
            format: deb
            architecture: amd64
            image: ubuntu:24.04
          - runner: ubuntu-24.04-arm
            format: deb
            architecture: arm64
            image: debian:bookworm-slim
          - runner: ubuntu-24.04-arm
            format: deb
            architecture: arm64
            image: ubuntu:24.04
          - runner: ubuntu-24.04
            format: rpm
            architecture: x86_64
            image: rockylinux:9
          - runner: ubuntu-24.04
            format: rpm
            architecture: x86_64
            image: fedora:45
          - runner: ubuntu-24.04-arm
            format: rpm
            architecture: aarch64
            image: rockylinux:9
          - runner: ubuntu-24.04-arm
            format: rpm
            architecture: aarch64
            image: fedora:45
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ matrix.format }}-${{ matrix.architecture }}
      - name: Test installer, packages, upgrades, and signatures in a clean container
        env:
          GNUPGHOME: ${{ runner.temp }}/test-gnupg
          VERSION: ${{ needs.release.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
          APT_SIGNING_PASSPHRASE: pgex-temporary-test-only
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg rpm createrepo-c
          mkdir -m700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 \
            --quick-generate-key 'pgex temporary repository test' rsa3072 sign 1d 3<<<"$APT_SIGNING_PASSPHRASE"
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          case "$FORMAT" in
            deb)
              kind=apt
              release/apt/build-repository.sh packages repository/apt "$key" http://127.0.0.1:8000/apt
              previous="/work/previous/pgex_$VERSION~test_$ARCHITECTURE.deb"
              ;;
            rpm)
              kind=rpm
              release/rpm/sign-packages.sh packages "$key"
              release/rpm/sign-packages.sh previous "$key"
              release/rpm/build-repository.sh packages repository/rpm "$key" http://127.0.0.1:8000/rpm
              previous="/work/previous/pgex-$VERSION-0.$ARCHITECTURE.rpm"
              ;;
          esac
          sed 's|https://pg-herd.github.io/pgex|http://127.0.0.1:8000|g' release/install.sh > installer.sh
          python3 -m http.server 8000 --directory repository > "$RUNNER_TEMP/http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 5 --retry-connrefused --retry-delay 1 --fail --silent "http://127.0.0.1:8000/$kind/pgex.asc" >/dev/null
          docker run --rm --network host --mount type=bind,src="$PWD",dst=/work,readonly "$IMAGE" \
            bash "/work/release/$kind/test-install.sh" "http://127.0.0.1:8000/$kind" \
            "/work/repository/$kind/pgex.asc" "$VERSION" "$previous" /work/installer.sh
      - name: Check unsupported platforms leave package configuration unchanged
        if: matrix.architecture == 'amd64' && matrix.image == 'debian:bookworm-slim'
        run: |
          docker run --rm --mount type=bind,src="$PWD",dst=/work,readonly debian:bookworm-slim \
            bash /work/release/test-installer.sh /work/release/install.sh

  publish:
    if: github.event_name != 'push'
    needs: [release, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Import the existing repository signing key
        env:
          GNUPGHOME: ${{ runner.temp }}/package-gnupg
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          [[ -n "$APT_SIGNING_KEY" && -n "$APT_SIGNING_PASSPHRASE" ]] || { echo 'Repository signing secrets are missing.' >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg rpm createrepo-c
          mkdir -m700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          expected=$(gpg --batch --with-colons --show-keys release/pgex.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          [[ "$key" == "$expected" ]] || { echo 'Signing key does not match the published public key.' >&2; exit 1; }
          release/rpm/sign-packages.sh artifacts/packages "$key"
      - name: Publish new packages and collect existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets
          for package in artifacts/packages/*.deb artifacts/packages/*.rpm; do
            if ! grep -Fxq "$(basename "$package")" existing-assets; then
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$package"
            fi
          done
          mkdir -p repository-packages/deb repository-packages/rpm
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .assets[] | select((.name | endswith(".deb")) or (.name | endswith(".rpm"))) | .browser_download_url' \
            > package-urls
          while IFS= read -r url; do
            case "$url" in *.deb) format=deb ;; *.rpm) format=rpm ;; *) exit 1 ;; esac
            curl --fail --location --silent --show-error "$url" --output "repository-packages/$format/${url##*/}"
          done < package-urls
      - name: Sign and assemble both repositories and the installer
        env:
          GNUPGHOME: ${{ runner.temp }}/package-gnupg
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          release/apt/build-repository.sh repository-packages/deb site/apt "$key"
          release/rpm/build-repository.sh repository-packages/rpm site/rpm "$key"
          install -m644 release/install.sh site/install.sh
          touch site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy the Linux repositories and installer
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
