name: AUR package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aur.yml'
      - 'release/aur/**'
      - 'release/arch/Dockerfile'
      - 'release/arch/PKGBUILD.in'
      - 'release/arch/build-package.sh'
      - 'release/arch/prepare-package.py'
  pull_request:
    paths:
      - '.github/workflows/aur.yml'
      - 'release/aur/**'
      - 'release/arch/Dockerfile'
      - 'release/arch/PKGBUILD.in'
      - 'release/arch/build-package.sh'
      - 'release/arch/prepare-package.py'
  workflow_run:
    workflows: ['Release binaries']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (empty means latest stable release)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: aur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag=${REQUESTED_TAG:-${RELEASE_TAG:-}}
          tag=$(gh release view ${tag:+"$tag"} --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("A published stable release is required") else empty end'
          archive="pgex-$tag-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive*"
          sha256sum --check "$archive.sha256"
          checksum=$(sha256sum "$archive" | cut -d ' ' -f 1)
          mkdir generated
          python3 release/arch/prepare-package.py release/arch/PKGBUILD.in pgex-bin "$tag" "$checksum" generated/PKGBUILD
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Test the AUR recipe, installation, and upgrade on Arch Linux
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker build --tag pgex-aur-builder release/arch
          docker run --rm --mount type=bind,src="$PWD",dst=/work pgex-aur-builder \
            /work/release/aur/test-package.sh /work/generated/PKGBUILD "/work/pgex-$TAG-x86_64-unknown-linux-gnu.tar.gz" /work/tested
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-recipe
          path: |
            tested/PKGBUILD
            tested/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur-recipe
          path: recipe
      - name: Publish only the latest stable version
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$TAG" == "$latest" ]]; then
            [[ -n "$AUR_SSH_PRIVATE_KEY" ]] || { echo 'AUR_SSH_PRIVATE_KEY is missing. Configure the AUR account and publishing key first.' >&2; exit 1; }
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Leaving AUR on the latest stable release.'
          fi
      - name: Update pgex-bin on AUR
        if: steps.latest.outputs.publish == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@9901fcce90f4089145583a9ac8e828b0049e3a27
        with:
          pkgname: pgex-bin
          pkgbuild: recipe/PKGBUILD
          commit_username: Tomer Sela
          commit_email: tomersela@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update pgex-bin to ${{ needs.package.outputs.version }}
