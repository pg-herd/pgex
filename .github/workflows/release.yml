name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUST_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5c4394ada46510f46605deb7cec477e # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release archive name
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag must match the Cargo.toml version (v$version)" >&2
            exit 1
          fi
          echo "ARCHIVE_NAME=pgex-v$version-$RUST_TARGET" >> "$GITHUB_ENV"

      - name: Build and check macOS runtime dependencies
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --target "$RUST_TARGET"
          brew install libpq
          export PQ_LIB_DIR="$(brew --prefix libpq)/lib"
          export LIBCLANG_PATH="$(dirname "$(xcrun --find clang)")/../lib"
          cargo build --release --locked --target "$RUST_TARGET"
          mkdir -p release-output
          cp "target/$RUST_TARGET/release/pgex" release-output/
          bash release/check-macos-linkage.sh release-output/pgex | tee release-output/runtime-dependencies.txt
          release-output/pgex --help

      - name: Build and check Linux runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --platform "$DOCKER_PLATFORM" \
            --file release/linux.Dockerfile --output type=local,dest=release-output .

      - name: Package the verified binary
        shell: bash
        run: |
          mkdir -p "artifacts" "$ARCHIVE_NAME/licenses"
          cp release-output/pgex release-output/runtime-dependencies.txt README.md CONTRIBUTING.md LICENSE "$ARCHIVE_NAME/"
          cp licenses/*.txt "$ARCHIVE_NAME/licenses/"
          COPYFILE_DISABLE=1 tar -czf "artifacts/$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          cd artifacts
          shasum -a 256 "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum --check -- *.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes -- *.tar.gz *.sha256
