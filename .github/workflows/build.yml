name: Build and test binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            dockerfile: release/linux.Dockerfile
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            dockerfile: release/linux.Dockerfile
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
            dockerfile: release/alpine/Dockerfile
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
            dockerfile: release/alpine/Dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUST_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release archive name
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag must match the Cargo.toml version (v$version)" >&2
            exit 1
          fi
          echo "ARCHIVE_NAME=pgex-v$version-$RUST_TARGET" >> "$GITHUB_ENV"

      - name: Install macOS build and test dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --target "$RUST_TARGET"
          brew install libpq postgresql@17
          native_cache_key=$(brew list --versions libpq openssl@3 postgresql@17 | shasum -a 256 | awk '{print $1}')
          {
            echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib"
            echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib"
            echo "PGEX_TEST_POSTGRES_BIN=$(brew --prefix postgresql@17)/bin"
            echo "NATIVE_CACHE_KEY=$native_cache_key"
          } >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os == 'macOS'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ env.NATIVE_CACHE_KEY }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-${{ matrix.target }}-${{ env.NATIVE_CACHE_KEY }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            release-${{ matrix.target }}-${{ env.NATIVE_CACHE_KEY }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Run the full macOS test suite
        if: runner.os == 'macOS'
        run: cargo test --locked --target "$RUST_TARGET" -- --test-threads=2

      - name: Build and check macOS runtime dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release --locked --target "$RUST_TARGET"
          mkdir -p release-output
          cp "target/$RUST_TARGET/release/pgex" release-output/
          bash release/check-macos-linkage.sh release-output/pgex | tee release-output/runtime-dependencies.txt
          release-output/pgex --help

      - name: Test the optimized macOS release binary
        if: runner.os == 'macOS'
        env:
          PGEX_TEST_BINARY: ${{ github.workspace }}/release-output/pgex
        run: |
          for test in \
            cli:: \
            target_transfer::applies_a_delete_filter_separately_from_a_copy_predicate \
            target_transfer::exporter_timeout_during_copy_closes_workers_and_restores_destination_rows
          do
            cargo test --locked --target "$RUST_TARGET" --test integration "$test" -- --test-threads=2
          done

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: runner.os == 'Linux'

      - name: Build and check Linux runtime dependencies
        if: runner.os == 'Linux'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=release-output
          cache-from: type=gha,scope=release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-build
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-build

      - name: Build the Linux test runner
        if: runner.os == 'Linux'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: test
          load: true
          tags: pgex-tests
          cache-from: |
            type=gha,scope=release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-build
            type=gha,scope=release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-test
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-test

      - name: Run the full Linux test suite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --network host \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --env DOCKER_HOST=unix:///var/run/docker.sock --env PGEX_TEST_HOST=localhost \
            pgex-tests

      - name: Build the minimal Linux runtime
        if: runner.os == 'Linux'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: verify
          load: true
          tags: pgex-runtime
          cache-from: |
            type=gha,scope=release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-build
            type=gha,scope=release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-runtime
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-runtime

      - name: Test the optimized Linux release binary
        if: runner.os == 'Linux'
        run: |
          docker run --rm --entrypoint cat pgex-runtime /out/pgex > runtime-pgex
          cmp release-output/pgex runtime-pgex
          bash release/docker/test-image.sh pgex-runtime

      - name: Package the verified binary
        shell: bash
        run: |
          mkdir -p "artifacts" "$ARCHIVE_NAME/licenses"
          cp release-output/pgex release-output/runtime-dependencies.txt README.md CONTRIBUTING.md LICENSE "$ARCHIVE_NAME/"
          cp licenses/*.txt "$ARCHIVE_NAME/licenses/"
          COPYFILE_DISABLE=1 tar -czf "artifacts/$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          cd artifacts
          shasum -a 256 "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error

