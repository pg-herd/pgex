name: Nix package

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'release/nix/**'
      - '.github/workflows/nix.yml'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'release/nix/**'
      - '.github/workflows/nix.yml'
  workflow_run:
    workflows: ['Release binaries']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          python3 release/nix/update-release.py "$tag" release/nix/sources.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-release
          path: release/nix/sources.json

  test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nix-release
          path: release/nix
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build and check the installed Nix package
        run: nix flake check --print-build-logs
      - name: Test Nix installation and upgrades
        run: bash release/nix/test-install.sh "$PWD"

  publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nix-release
          path: release/nix
      - name: Update the public flake to the tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add release/nix/sources.json
          if git diff --cached --quiet; then
            echo 'The Nix package is already up to date.'
            exit 0
          fi
          version=$(python3 -c 'import json; print(json.load(open("release/nix/sources.json"))["version"])')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Nix package to $version"
          gh auth setup-git
          git pull --rebase origin main
          git push origin HEAD:main
